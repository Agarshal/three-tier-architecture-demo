name: Robot Shop CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    name: Validate Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint K8s/helm

      - name: Helm template
        run: helm template robot-shop K8s/helm > /tmp/robot-shop-rendered.yaml

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        service:
          - catalogue
          - ratings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: robot-shop/${{ matrix.service }}:ci
